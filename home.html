<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type tester</title>
    <link href="Banana.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">

    <script src="Java_styles_banana.js" defer></script>
    <script src="https://kit.fontawesome.com/4d89eb1ff3.js" crossorigin="anonymous"></script>
    <script type="module" src="Backend/TypTest/engine.js"></script>
</head>

<style>
 
  .typing-box {
    width: min(900px, 94vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0 auto;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .row label { flex: 1; }
  .full-label { width: 100%; }
  input[type="text"], select, button {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid #b3e9b3;
    border-radius: 4px;
    background: #fff;
  }
  button { cursor: pointer; background-color: brown;}
  input[type="text"] { width: 100%; }

  #Word-guide-container {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4em;   /* space between words */
}

.run-graph-section {
  margin-top: 8px;
}
.run-graph-section h2, .run-chart-message {
  color: var(--title_and_icon);
  text-align: center;
}
.run-graph {
  height: 220px;
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  background: var(--chart_bg);
}
.run-graph canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.run-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  color: var(--title_and_icon);
}
.run-chart-message {
  min-height: 1.5em;
}

</style>

<body>
    <header>
        <nav>
            <div class="navigation">
                <button class="settings icon" id="knopje_menu"><i class="fa-solid fa-gear"></i></button>
                <div class="tooltip" id="tt_settings">Settings</div>
                <ul class="dropdown_menu" id="menuutje">
                    <li>
                        <p>Language</p>
                        <button id="to_English" data-language="en">English</button>
                        <button id="to_Dutch" data-language="nl">Nederlands</button>
                    </li>
                    <li>
                        <p>Difficulty</p>
                        <button id="to_makkelijk" data-difficulty="0">Makkelijk</button>
                        <button id="to_gemiddeld" data-difficulty="1">Gemiddeld</button>
                        <button id="to_moeizaam" data-difficulty="2">Moeizaam</button>
                        <button id="to_ingewikkeld" data-difficulty="3">Ingewikkeld</button>
                        <button id="to_onmogelijk" data-difficulty="4">Onmogelijk</button>
                    </li>
                    <li>
                        <p>Appearance</p> 
                        <button id="get_light">Light mode</button>
                        <button id="get_dark">Dark mode</button>
                    </li>
                </ul>
                
                <a href="statistics.html" class="statistics icon"><i class="fa-solid fa-chart-column"></i></a>
                <div class="tooltip" id="tt_statistics">Statistics</div>
                
            </div>

            
        </nav>
        
    </header>

    <main>
        <div class="title">
            <h1>Type tester</h1>
            </div>
        <div class="typing-box">
    <div class="row">
      <button type="button", id="reset-btn">Reset</button>
      <label>Language:</label>
      <select id="language">
        <option>nl</option>
        <option>en</option>
      </select>
      <label>Difficulty:</label>
      <select id="difficulty">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
        <div id="Word-guide-container">
            <p>Druk op "Reset" om te beginnen</p>
        </div>
        <input type="text" id="main-input">
        <section class="run-graph-section" aria-labelledby="run-graph-title">
          <h2 id="run-graph-title">Speed during this run</h2>
          <div class="run-graph">
            <canvas id="run-speed-chart" role="img" aria-label="Graph of typing speed over time during this run"></canvas>
          </div>
          <div class="run-stats" aria-live="polite">
            <span id="wpm-count">Speed: --</span>
            <span id="char-count">Chars: 0</span>
            <span id="word-count">Words: 0</span>
            <span id="timer">Time: 0s / 10s</span>
          </div>
          <p class="run-chart-message" id="run-chart-message" aria-live="polite">Your speed during this run will appear here.</p>
        </section>
        </div>
    </main>
</body>
</html>
