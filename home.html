<!DOCTYPE html>
<html lang="Nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type tester</title>
    <link href="Banana.css" rel="stylesheet">
<script src="https://kit.fontawesome.com/4d89eb1ff3.js" crossorigin="anonymous"></script>
<body>
    <header>
        <nav>
            <div class="navigation">
                <button class="settings icon"><i class="fa-solid fa-gear"></i></button>
                <div class="label">Settings</div>
                <ul class="dropdown_menu">
                    <li>Language
                        <ul>
                            <li>English</li>
                            <li>Nederlands</li>
                        </ul>
                    </li>
                    <li>Difficulty
                        <ul>
                            <li>Easy</li>
                            <li>Medium</li>
                            <li>Hard</li>
                        </ul>
                    </li>
                    <li>Appearance
                        <ul>
                            <li>Light mode</li>
                            <li>Dark mode</li>
                        </ul>
                    </li>
                </ul>
                <button class="statistics icon"><i class="fa-solid fa-chart-column"></i></button>
                <div class="label">Statistics</div>
            </div>

            <div class="title">
                <h1>Type tester</h1>
            </div>
        </nav>
        
    </header>
    <main>
        <div class="live-stats">
            <h2><span>0</span> rpm</h2>
            <h2><span>0</span> Errors</h2>

            <div class="Score">

            </div>
        </div>
    </main>
    <footer>
        
    </footer>
</body>
</html>
