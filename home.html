<!DOCTYPE html>
<html lang="Nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type tester</title>
    <link href="Banana.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">

    <script src="Java_styles_banana.js" defer></script>
    <script src="https://kit.fontawesome.com/4d89eb1ff3.js" crossorigin="anonymous"></script>
<body onload="check_storage">
    <header>
        <nav>
            <div class="navigation">
                <button class="settings icon" id="knopje_menu"><i class="fa-solid fa-gear"></i></button>
                <div class="tooltip">Settings</div>
                <ul class="dropdown_menu show" id="menuutje">
                    <li><details>
                        <summary>Language</summary>
                        <button>English</button>
                        <button>Nederlands</button>
                    </details></li>
                    <li><details>
                        <summary>Difficulty</summary>
                        <button>Easy</button>
                        <button>Medium</button>
                        <button>Hard</button>
                    </details></li>
                    <li><details>
                        <summary>Appearance</summary> 
                            <button id="get_light">Light mode</button>
                            <button id="get_dark">Dark mode</button>
                    </details></li>
                </ul>
                
                <button class="statistics icon"><i class="fa-solid fa-chart-column"></i></button>
                
            </div>

            
        </nav>
        
    </header>
    <main>
        <div class="title">
                <h1>Type tester</h1>
            </div>
        <div class="live-stats">
            <h2><span>0</span> rpm</h2>
            <h2><span>0</span> Errors</h2>

            <div class="Score">

            </div>
        </div>
        <div class="input-box">
            <label for="input">The chicken ate money.:</label>
                
            </div>
        </div>
    </main>
    <footer>
        
    </footer>
</body>
</html>
