<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type tester</title>
    <link href="Banana.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">

    <script src="Java_styles_banana.js" defer></script>
    <script src="https://kit.fontawesome.com/4d89eb1ff3.js" crossorigin="anonymous"></script>
    <script type="module" src="./Backend/TypTest/engine.js"></script>
</head>

<body>
    <header class="typing-header" style="margin-top: 20px;">
        <nav>
            <div class="navigation typing_nav">

                <ul class="dropdown_menu" id="menuutje">
                    <li>
                        <p>Typing language</p>
                        <button id="to_English" data-language="en">English</button>
                        <button id="to_Dutch" data-language="nl">Nederlands</button>
                    </li>
                    <li>
                        <p>Difficulty</p>
                        <button id="to_makkelijk" data-difficulty="0">Easy</button>
                        <button id="to_gemiddeld" data-difficulty="1">Medium</button>
                        <button id="to_moeizaam" data-difficulty="2">Hard</button>
                        <button id="to_ingewikkeld" data-difficulty="3">Very Hard</button>
                        <button id="to_onmogelijk" data-difficulty="4">Impossible</button>
                    </li>
                    <li>
                        <p>Appearance</p> 
                        <button id="get_light">Light mode</button>
                        <button id="get_dark">Dark mode</button>
                    </li>
                </ul> 
                <button class="settings icon" id="knopje_menu"><i class="fa-solid fa-gear"></i></button>
                <div class="tooltip" id="tt_settings">Settings</div>              
                <a href="statistics.html" class="statistics icon"><i class="fa-solid fa-chart-column"></i></a>
                <div class="tooltip" id="tt_statistics">Statistics</div>
                
            </div>
           
        </nav>
        
    </header>

    <main class="typing-main">
        <div class="title" style="margin-top: 50px;">
            <h1>Type tester</h1>
        </div>
        <hr class="typing-heading-divider">
        <div class="typing-box">
    <div class="row">
      <div><button type="button", id="reset-btn" class="typing_label">Reset</button></div>
      <div><label class="typing_label">Language:</label>
      <select id="language" class="typing_dropdown">
        <option>nl</option>
        <option>en</option>
      </select></div>
      <div><label class="typing_label">Difficulty:</label>
      <select id="difficulty" class="typing_dropdown">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select></div>
    </div>
        <div id="Word-guide-container" class="typing_guide_word_container">
            <p class="typing_label">Press "Reset" to begin</p>
        </div>
        <input type="text" id="main-input" placeholder="Click here and start typing...">
        <div id="timer_on_page"><p>0:00:00</p></div>
        <section id="run-graph-section" aria-labelledby="run-graph-title">
          <h2 id="run-graph-title">Speed during this run</h2>
          <div class="run-graph">
            <a href="statistics.html"><canvas id="run-speed-chart" role="img" aria-label="Graph of typing speed over time during this run"></canvas></a>
          </div>
          <div class="run-stats" aria-live="polite">
            <span id="wpm-count">Speed: --</span>
            <span id="char-count">Chars: 0</span>
            <span id="word-count">Words: 0</span>
            <span id="timer">Time: 0s / 10s</span>
          </div>
          <p class="run-chart-message" id="run-chart-message" aria-live="polite">Your speed during this run will appear here.</p>
        </section>
        </div>
    </main>
</body>
</html>
