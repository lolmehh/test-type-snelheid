<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="module" src="../Backend/TypTest/engine.js"></script>
<title>PLACEHOLDER</title>

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    color: #012f03;
  }
  .box {
    width: 420px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .row label { flex: 1; }
  .full-label { width: 100%; }
  input[type="text"], select, button {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid #b3e9b3;
    border-radius: 4px;
    background: #fff;
  }
  button { cursor: pointer; background-color: brown;}
  input[type="text"] { width: 100%; }

  #Word-guide-container {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4em;   /* space between words */
}

</style>
</head>
<body>
  <div class="box">
    <div class="row">
      <label id="wpm-count">wpm:None</label>
      <button type="button", id="reset-btn">Reset</button>
      <label>Language:</label>
      <select id="language">
        <option>nl</option>
        <option>en</option>
      </select>
      <label>Difficulty:</label>
      <select id="difficulty">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
      </select>
    </div>
    <div id="Word-guide-container">
        <p>test</p>
    </div>
    <input type="text" id="main-input">
  </div>
</body>
</html>
